[build-system]
requires = ["hatchling==1.21.1"]
build-backend = "hatchling.build"

[project]
name = "arc"
version = "0.1.0"
description = "Analysis, reporting and certification for a seed testing laboratory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Ravenscar Seed Testing Station" }]
dependencies = ["click==8.1.7"]

[project.scripts]
arc = "arc.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "pytest-cov==4.1.0",
    "ruff==0.2.1",
    "mypy==1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arc"]

[tool.pytest.ini_options]
# Every test in the repository lives under /tests, so pytest is pointed there
# rather than the tree being split between the package and a tests directory
# inside it.
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes long enough to be worth skipping while iterating",
]

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RET", "C4"]

[tool.ruff.lint.per-file-ignores]
# The exceptions are named for what went wrong rather than for the fact that
# they are exceptions. "raise NotFound" is the sentence; "raise NotFoundError"
# is the sentence with a stutter in it.
"src/arc/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
# The tests directory holds two conftest.py files and no __init__.py, which
# mypy reads as the same module written twice unless it is told to name modules
# from the repository root down.
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"
